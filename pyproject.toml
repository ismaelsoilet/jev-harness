[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jev-harness"
version = "0.1.9"
description = "Zero-dependency System One decision harness, token optimizer, and semantic guardrails for AI coding agents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Ismael Hosni Soilet de Lima", email = "soilet.ismael@gmail.com" }
]
keywords = [
    "typesafe",
    "jev",
    "system-one",
    "agentic-ai",
    "token-optimizer",
    "mcp",
    "model-context-protocol",
    "guardrails",
    "opencode",
    "cursor",
    "claude-code"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = []

[project.scripts]
jev-harness = "jev_harness.cli:main"
jev-mcp = "jev_harness.mcp_server:main"

[project.urls]
Homepage = "https://github.com/ismaelsoilet/jev-harness"
Documentation = "https://github.com/ismaelsoilet/jev-harness#readme"
Repository = "https://github.com/ismaelsoilet/jev-harness.git"
Issues = "https://github.com/ismaelsoilet/jev-harness/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_harness"]
