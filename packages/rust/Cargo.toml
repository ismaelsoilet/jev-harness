[package]
name = "jev-harness"
version = "0.1.4"
edition = "2021"
authors = ["ISMAEL HOSNI SOILET DE LIMA <soilet.ismael@gmail.com>"]
description = "Zero-overhead System One decision harness and token optimizer for AI coding agents."
license = "MIT"
repository = "https://github.com/ismaelsoilet/jev-harness"
homepage = "https://github.com/ismaelsoilet/jev-harness"
documentation = "https://docs.rs/jev-harness"
keywords = ["typesafe", "jev", "system-one", "agentic-ai", "token-optimizer"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[lib]
name = "jev_harness"
path = "src/lib.rs"

[[bin]]
name = "jev"
path = "src/bin/jev.rs"

[[bin]]
name = "jev-harness"
path = "src/bin/jev_harness.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1.38", features = ["macros", "rt-multi-thread", "io-std", "io-util"] }
clap = { version = "4.5", features = ["derive"] }
regex = "1.10"

[dev-dependencies]
tokio = { version = "1.38", features = ["full"] }
