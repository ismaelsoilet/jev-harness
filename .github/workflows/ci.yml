name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check-manifest-sync:
    name: Strict Quad-Manifest Version Parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install TypeScript dependencies
        working-directory: packages/ts
        run: npm ci || npm install
      - name: Verify Manifest & Version Parity
        run: |
          chmod +x scripts/release.sh
          ./scripts/release.sh --verify-sync

  test-python:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package in editable mode
        run: pip install -e .

      - name: Run Python unit test suite
        run: |
          python -m unittest discover -s tests -v

      - name: Test CLI entrypoints (Installed & Direct script)
        run: |
          jev-harness status
          jev-harness route --task "Fix typo in docstrings" --json --mock
          echo "ModuleNotFoundError: test" | jev-harness test-gate --mock
          python src/jev_harness/cli.py status
          python src/jev_harness/cli.py route --task "Fix typo in docstrings" --json --mock
          echo "ModuleNotFoundError: test" | python src/jev_harness/cli.py test-gate --mock

      - name: Test MCP Server entrypoints (Installed & Direct script)
        run: |
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' | jev-mcp
          echo '{"jsonrpc":"2.0","id":2,"method":"initialize","params":{}}' | python src/jev_harness/mcp_server.py

  test-typescript:
    name: TypeScript (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["18.x", "20.x", "22.x"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies & run TypeScript tests
        working-directory: packages/ts
        run: |
          npm ci || npm install
          npm test

      - name: Test TypeScript CLI
        working-directory: packages/ts
        run: |
          node bin/cli.js status
          node bin/cli.js route "Fix typo in docstrings"
          node bin/cli.js triage "Cannot find module 'lodash'"

  test-rust:
    name: Rust (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust tests
        working-directory: packages/rust
        run: |
          cargo check --all-targets
          cargo test --verbose

      - name: Test compiled CLI binaries
        working-directory: packages/rust
        run: |
          cargo run --bin jev -- status
          cargo run --bin jev -- route --task "Fix typo in variable"
          echo "ModuleNotFoundError: torch" | cargo run --bin jev -- test-gate
